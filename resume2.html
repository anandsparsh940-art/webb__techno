    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            color: black;
        }

        .navbar {
            height: 60px;

            align-items: center;

        .heading {
            margin-top: 22px;
        }

        .heading h1 {
            font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
            font-size: 30px;
            margin: 0;
        }

        .heading p {
            margin-top: 5px;
            font-size: 13px;
        }

        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;

            margin: 0;
        }

        .about a {
            color: white;
            text-decoration: underline;
        }

        .details {
            margin-top: 18px;
        }

        .details h2 {
            font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
            font-size: 20px;
            font-weight: normal;
            margin-bottom: 15px;
        }

        .details p {
            font-size: 10.5px;
            margin: 0 0 10px;
        }

        .details strong {
            display: block;
            margin-bottom: 10px;
            font-size: 10.5px;
        }

        .social {
            margin-top: 22px;
        }

        .social i {
            font-size: 13px;
            margin: 0 7px;

        }
    </style>
</head>

<body>
