<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>
     <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            color: black;
        }
        .heading {
            margin-top: 22px;
        }
        .heading h1 {

            background-color: #4f60b2;

        .about h2 {

        }
        .about p {
            font-size: 10.5px;
            line-height: 20px;
            margin: 0;
        }

        .about a {

        }

</head>

<body>
    <div class="heading">
